# Ablation 1: lightweight backbone + plain decoder, CrossEntropy.
# No CSP prior, no recall loss, no edge head. The "just a small U-Net" reference.
data: {task: 10class, batch_size: 12, subset_train: 4000, subset_val: 1000, oversample_rare: false, edge_from_mask: false}
model: {name: spearnet, backbone: mobilenetv3_small_100, csp_mode: none, use_edge_head: false}
loss: {w_ce: 1.0, w_dice: 0.0, w_tversky: 0.0, w_boundary: 0.0, w_edge: 0.0}
optim: {epochs: 40}
run: {out_dir: runs/ablation_1_baseline, save_best_metric: miou}
