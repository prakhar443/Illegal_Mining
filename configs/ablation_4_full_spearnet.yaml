# Ablation 4: CSP gate + edge head = full SPEAR-Net (same as spearnet_10class.yaml).
data: {task: 10class, batch_size: 12, subset_train: 4000, subset_val: 1000, oversample_rare: true, rare_class_ids: [3, 6, 8], edge_from_mask: true}
model: {name: spearnet, backbone: mobilenetv3_small_100, csp_mode: gate, use_edge_head: true}
loss: {w_ce: 0.0, w_dice: 1.0, w_tversky: 1.0, w_boundary: 0.5, w_edge: 0.5, w_focal: 1.0, focal_gamma: 2.0, present_only: true, auto_class_weights: true, tversky_alpha: 0.3, tversky_beta: 0.7}
optim: {epochs: 40}
run: {out_dir: runs/ablation_4_full_spearnet, save_best_metric: miou}
