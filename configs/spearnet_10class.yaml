# Full SPEAR-Net on the 10-class LAMES mine-sector segmentation task.
data:
  source: local                     # read the Google-Drive zips extracted to local_root
  local_root: data/lames            # where prepare_data.py extracts the dataset
  drive_folder_url: "https://drive.google.com/drive/folders/1A27Fn7HIL8UPQlx-xUmN8Dpzxl4SQsLh"
  zip_glob: "*.zip"
  val_fraction: 0.1                 # auto-split if the zips have no train/val/test dirs
  test_fraction: 0.0
  hf_name: maduschek/LAMES          # used only if source: hf
  task: 10class
  image_size: 256
  batch_size: 12
  num_workers: 2
  streaming: false
  subset_train: 4000      # dev cap; set null for the full 168k
  subset_val: 1000
  subset_test: null
  oversample_rare: true
  rare_class_ids: [3, 6, 8]   # heap leaching, processing plant, tailings
  edge_from_mask: true

model:
  name: spearnet
  backbone: mobilenetv3_small_100
  pretrained: true
  decoder_channels: [128, 64, 48, 32]
  csp_mode: gate
  csp_alpha_init: 1.0
  use_edge_head: true

loss:
  w_ce: 0.0
  w_dice: 1.0
  w_tversky: 1.0
  w_boundary: 0.5
  w_edge: 0.5
  tversky_alpha: 0.3
  tversky_beta: 0.7
  class_weights: null
  ignore_index: -100

optim:
  epochs: 40
  lr: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 2
  min_lr: 0.000001
  amp: true
  grad_clip: 1.0
  accumulate: 1

run:
  seed: 42
  out_dir: runs/spearnet_10class
  log_interval: 20
  val_interval: 1
  save_best_metric: miou
  device: cuda
  resume: null
